# Training configuration of the proposed model on ADHD-200:
# 3DSC-TF imaging encoder + NeuroGraph ROI encoder + cross-view contrastive alignment.
# These are the hyperparameters of the released checkpoints (found with an Optuna search).

seed: 42
data_dir: ./data/adhd          # folder with adhd_fold{1..5}_<N>.npy and roi_matrices_<N>.npy
roi_matrices_file: null        # null -> roi_matrices_<N>.npy, <N> taken from the fold-file names
n_rois: 116                    # AAL-116 atlas
num_classes: 2

# --- optimization ---
batch_size: 18
epochs: 40
lr: 0.00023816800631162475
weight_decay: 3.981780513861429e-06
dropout: 0.1776180790534864
label_smoothing: 0.08832787784276229
max_grad_norm: 2.0

# --- imaging branch: 3DSC-TF ---
image_encoder: 3dsctf
image_feat_dim: 256
image_encoder_kwargs:
  img_size: 96
  patch_size: 32
  embed_dim: 96
  depth: 8
  num_heads: 8
  mlp_ratio: 2.523099385226722
  qkv_bias: false
  drop_path_rate: 0.12210055856108193

# --- ROI branch: NeuroGraph (residual GNN) ---
roi_encoder: neurograph
roi_feat_dim: 256
roi_encoder_kwargs:
  hidden_channels: 64
  hidden_mlp: 128
  num_layers: 3
  gnn_name: SAGEConv
  edge_top_p: 0.12653208064924712

# --- fusion: cross-view contrastive alignment ---
fusion: contrastive
contrastive_temperature: 0.03124888239143141
contrastive_weight: 0.43019728220797776
